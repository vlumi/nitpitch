name: Nitpitch

options:
  bundleIdPrefix: fi.misaki
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  NitpitchCore:
    path: Packages/NitpitchCore

targets:
  Nitpitch-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Nitpitch
        # Track the version build settings so MARKETING_VERSION is the single
        # source of truth.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption → declare it so every TestFlight/App Store upload skips
        # the export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        # The microphone IS the instrument input — the app cannot function
        # without it. Audio is analyzed in-process frame by frame and never
        # recorded, buffered to disk, or sent anywhere.
        NSMicrophoneUsageDescription: Hear your instrument to show its pitch. Audio is analyzed on-device and never recorded or sent anywhere.
        LSApplicationCategoryType: public.app-category.music
        # Shared preset links (`nitpitch://preset#…`). A custom scheme rather
        # than a Universal Link: that would need a domain and a hosted
        # apple-app-site-association file, and the payload rides in the URL
        # fragment either way — so nitpitch.app can serve these as ordinary
        # static links later without the format changing.
        CFBundleURLTypes:
          - CFBundleURLName: fi.misaki.nitpitch.preset
            CFBundleURLSchemes:
              - nitpitch
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: true
          UIColorName: LaunchBackground
        # Portrait-only is wrong for a tuner clipped to a stand, and a universal
        # (iPhone + iPad) app must support all four for iPad multitasking or App
        # Store validation rejects the build. The readout is orientation-agnostic.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.nitpitch
        # User-visible app/bundle name; without this it'd be the target name
        # "Nitpitch-iOS". Module name stays Nitpitch_iOS (PRODUCT_MODULE_NAME).
        PRODUCT_NAME: Nitpitch
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/Nitpitch.entitlements
        MARKETING_VERSION: "0.2.0"
        # Build number is shared across iOS + macOS + watchOS (kept in lock-step
        # by the release lane, `make release`) — bumped together so the apps
        # never diverge; ASC also requires the embedded watch app to match.
        # 0 = never released; the first `make release` cuts build 1.
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing: the personal paid-account team. Automatic signing lets Xcode
        # manage the certs/profiles for archive + TestFlight upload.
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: NitpitchCore
        product: NitpitchKit
      # Embeds the watch app in every iPhone build (Watch/ in the bundle) —
      # xcodegen writes the Embed Watch Content phase from this one line.
      - target: Nitpitch-watchOS
    # Stamp the git commit into the bundled Info.plist (GitCommitSHA) so every
    # build self-identifies its source. Runs last, after the plist is copied
    # into the product; fires on archive too. See Scripts/embed-commit-sha.sh.
    postBuildScripts:
      - script: "\"$SRCROOT/Scripts/embed-commit-sha.sh\""
        name: Embed git commit SHA
        basedOnDependencyAnalysis: false
    scheme:
      # Wire the UI tests into the iOS app's scheme so `xcodebuild test
      # -scheme Nitpitch-iOS` runs them (used by `make uitest`, locally only).
      testTargets:
        - Nitpitch-iOSUITests

  # Local-only UI regression tests. CI runs `swift test` (the package logic
  # suite) and `xcodebuild build` only — never `xcodebuild test` — so this
  # target is built but its tests run solely via `make uitest` on a dev machine.
  Nitpitch-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.nitpitch.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nitpitch-iOS

  # The wrist scaffold: a standalone chromatic tuner on NitpitchCore only —
  # mic and DSP run on the watch, per the settled architecture (AGENTS.md
  # "The watch"). EMBEDDED in the iOS app since the watch earned TestFlight:
  # the iOS target's dependency below carries it into every phone build, so
  # `make release PLATFORM=ios` ships both. Still fully standalone at
  # runtime — companion-shaped only in data, riding iCloud sync.
  Nitpitch-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Sources/watchOS
      # The shared asset catalog: the same tuning-fork icon as everywhere
      # (a `watchos` platform entry in the appiconset; the art is centred,
      # so the watch's circular mask crops nothing that matters).
      - path: Sources/Shared
    info:
      path: Sources/watchOS/Info.plist
      properties:
        CFBundleDisplayName: Nitpitch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Hear your instrument to show its pitch. Audio is analyzed on-device and never recorded or sent anywhere.
        WKApplication: true
        WKCompanionAppBundleIdentifier: fi.misaki.nitpitch
    settings:
      base:
        # The companion convention (<ios-bundle-id>.watchkitapp). Renamed from
        # fi.misaki.nitpitch.watch at embed time — local watch installs from
        # the watch-only era are a different app; sync carries the data over.
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.nitpitch.watchkitapp
        PRODUCT_NAME: Nitpitch
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud KVS for sync — the same explicit store id as iOS/macOS.
        CODE_SIGN_ENTITLEMENTS: Sources/watchOS/Nitpitch.entitlements
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: NitpitchCore
        product: NitpitchCore
      - package: NitpitchCore
        product: NitpitchData
    # Shared scheme so `xcodebuild -scheme Nitpitch-watchOS` works on a fresh
    # checkout (CI, make build-watch) — same reason as the macOS target.
    scheme:
      configVariants: []

  Nitpitch-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/macOS
      - path: Sources/Shared
    info:
      path: Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: Nitpitch
        CFBundleName: Nitpitch  # menu-bar app name (else PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        # Shared preset links (`nitpitch://preset#…`). A custom scheme rather
        # than a Universal Link: that would need a domain and a hosted
        # apple-app-site-association file, and the payload rides in the URL
        # fragment either way — so nitpitch.app can serve these as ordinary
        # static links later without the format changing.
        CFBundleURLTypes:
          - CFBundleURLName: fi.misaki.nitpitch.preset
            CFBundleURLSchemes:
              - nitpitch
        # Must track the deploymentTarget above — this explicit key OVERRIDES the
        # build-setting-derived minimum, so a stale value advertises installability
        # on an OS the binary was never built for.
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # On the Mac the input is typically a line-in / audio interface rather
        # than the built-in mic (electric guitar and bass via a DI or preamp),
        # but macOS gates every input device behind the same microphone consent.
        NSMicrophoneUsageDescription: Hear your instrument to show its pitch. Audio is analyzed on-device and never recorded or sent anywhere.
    settings:
      base:
        # Shares the iOS bundle ID for Universal Purchase: one App Store record
        # spanning both platforms, sharing the name, Apple ID, and SKU.
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.nitpitch
        PRODUCT_NAME: Nitpitch
        MARKETING_VERSION: "0.2.0"
        # Build number is shared across iOS + macOS + watchOS (kept in lock-step
        # by the release lane, `make release`) — bumped together so the apps
        # never diverge; ASC also requires the embedded watch app to match.
        # 0 = never released; the first `make release` cuts build 1.
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Mac App Store requires App Sandbox; the entitlement enables it (and
        # declares the audio-input exception the tuner needs).
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/Nitpitch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing: same personal paid-account team as iOS; automatic signing.
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    # See the iOS target: stamp the git commit into the bundled Info.plist.
    postBuildScripts:
      - script: "\"$SRCROOT/Scripts/embed-commit-sha.sh\""
        name: Embed git commit SHA
        basedOnDependencyAnalysis: false
    dependencies:
      - package: NitpitchCore
        product: NitpitchKit
    # Explicit scheme so XcodeGen writes a SHARED scheme file for the macOS app.
    # Without it Xcode recreates it as a personal scheme on every open, and
    # `xcodebuild -scheme Nitpitch-macOS` fails on a fresh checkout (the release
    # lane's macOS archive).
    scheme:
      configVariants: []
